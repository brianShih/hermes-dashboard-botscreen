name: Bot Screen checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long source paths on Windows runners
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Installer unit checks
        run: python -m unittest discover -s scripts/tests -v
      - name: Plugin unit checks
        run: node --test bot-screen-plugin/tests/*.test.mjs
      - name: Verify recorded source snapshot
        run: python verify-source.py
      - name: Install locked build dependencies
        working-directory: bot-screen-plugin
        run: npm ci
      - name: Build plugin
        working-directory: bot-screen-plugin
        run: node build.mjs
