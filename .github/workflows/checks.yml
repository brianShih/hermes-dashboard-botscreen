name: Bot Screen checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long source paths on Windows runners
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Installer unit checks
        run: python -m unittest discover -s scripts/tests -v
      - name: Plugin unit checks
        run: node --test bot-screen-plugin/tests/*.test.mjs
      - name: Verify recorded source snapshot
        run: python verify-source.py
      - name: Install locked build dependencies
        working-directory: bot-screen-plugin
        run: npm ci
      - name: Build plugin
        working-directory: bot-screen-plugin
        run: node build.mjs
